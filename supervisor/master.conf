[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/hvacassistant-admin/htdocs/admin.hvacassistant.tech/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/home/hvacassistant-admin/htdocs/admin.hvacassistant.tech/storage/logs/worker.log
stopwaitsecs=3600

[program:laravel-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /home/hvacassistant-admin/htdocs/admin.hvacassistant.tech/artisan reverb:start
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/home/hvacassistant-admin/htdocs/admin.hvacassistant.tech/storage/logs/reverb.log

[group:laravel-services]
programs=laravel-worker,laravel-reverb