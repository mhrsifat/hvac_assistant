stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:latest
  variables:
    FTP_SERVER: '72.62.174.133'
    FTP_PORT: '21'
    FTP_USERNAME: 'laravel'
    FTP_PASSWORD: "p33yc41KWq,'95,3Dg?W"
    FTP_PATH: '/'
  before_script:
    - apk add --no-cache lftp
  script:
    - |
      lftp -p "$FTP_PORT" -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
      set ftp:ssl-allow no
      set ftp:use-site-chmod false
      set ftp:preserve-permissions false
      mirror -R --verbose --only-newer --no-perms \
        --exclude-glob vendor/ \
        --exclude-glob .env \
        --exclude-glob .git/ \
        ./ $FTP_PATH
      quit
      EOF
  only:
    - sifat
