stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:latest
  variables:
    SSH_HOST: '72.62.174.133'
    SSH_USER: 'admin'
    SSH_PORT: '22'
    SSH_PATH: '/home/admin/htdocs/admin.hvacassistant.tech'
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      rsync -az --update --no-perms --no-owner --no-group \
        --exclude 'vendor/' \
        --exclude '.env' \
        --exclude '.git/' \
        -e "ssh -p $SSH_PORT" \
        ./ "$SSH_USER@$SSH_HOST:$SSH_PATH"
  only:
    - sifat
