services:
  postgres_vector:
    image: ankane/pgvector:latest
    container_name: postgres_vector_db
    restart: always
    environment:
      POSTGRES_USER: hvac_user
      POSTGRES_PASSWORD: hvac_password
      POSTGRES_DB: hvac_vector_db
    ports:
      - '5433:5432'
    volumes:
      - pg_vector_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hvacassistant.tech
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - '5050:80'
    depends_on:
      - postgres_vector

  redis:
    image: redis:alpine
    container_name: hvac_redis
    restart: always
    ports:
      - '127.0.0.1:6381:6379'
    command: redis-server --requirepass "what_the_hell_is_this_password" --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

volumes:
  pg_vector_data:
  redis_data:
